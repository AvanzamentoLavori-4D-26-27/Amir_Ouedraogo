<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gioco dei Colori</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column align-items-center justify-content-center vh-100 m-0">

    <div class="container text-center" style="max-width: 340px;">
        <h1 class="h4 mb-3 fw-bold">Trova i Colori</h1>
        
        <button id="btnStart" class="btn btn-primary mb-3 px-4">Inizia a Giocare</button>

        <div id="wrapper" class="row row-cols-4 g-3 mb-4 noClick"></div>

        <div id="txtRis" class="fs-5 fw-semibold text-secondary mb-3"></div>
        <div id="timer" class="badge bg-dark fs-6 px-3 py-2">Tempo: 00:00</div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
