<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="js/index.js" defer></script>
    <title>Esercizio – Il mio compleanno</title>
</head>

<body class="bg-light">
    <main class="container my-4" style="max-width: 640px;">
        <h1 class="h3 mb-4">Il mio prossimo compleanno</h1>

        <p>Oggi è <strong id="oggi">…</strong></p>
        <p>Dall'inizio della scuola (14 settembre 2026) sono passati <strong id="giorniScuola">…</strong> giorni.</p>

        <label for="nascita" class="form-label">La tua data di nascita</label>
        <input type="date" id="nascita" class="form-control mb-3">

        <ul class="list-group">
            <li class="list-group-item">Il tuo prossimo compleanno è <strong id="prossimo">…</strong></li>
            <li class="list-group-item">Mancano <strong id="mancano">…</strong> giorni</li>
            <li class="list-group-item">Compirai <strong id="anniCompiuti">…</strong> anni</li>
        </ul>
    </main>
</body>

</html>
