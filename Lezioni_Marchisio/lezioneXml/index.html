<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="js/script.js" defer></script>
    <title>Costruiamo insieme – la playlist in XML</title>
</head>

<body class="bg-light">
    <main class="container my-4" style="max-width: 720px;">
        <h1 class="h3 mb-1">La playlist in XML</h1>
        <p class="text-muted small"></p>

        <label for="sorgente" class="form-label fw-semibold">Il documento (stringa)</label>
        <textarea id="sorgente" class="form-control font-monospace small mb-2" rows="14" spellcheck="false"></textarea>
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
            <button id="btnLeggi" class="btn btn-primary btn-sm" onclick="Leggi()">Leggi</button>
            <button id="btnSalva" class="btn btn-outline-primary btn-sm" ">Salva come .xml</button>
            <label for="fileXml" class="small text-muted ms-2 mb-0">oppure apri un file .xml dal disco:</label>
            <input type="file" id="fileXml" accept=".xml,text/xml,application/xml" class="form-control form-control-sm w-auto">
        </div>

        <div id="esito" class="alert alert-secondary small">Nessun documento letto.</div>

        <h2 class="h5 mt-4">Playlist: <span id="nomePlaylist">…</span></h2>
        <p class="small">Brani: <strong id="numero">…</strong> · durata totale: <strong id="durataTotale">…</strong></p>
        <ul id="elenco" class="list-group"></ul>
    </main>
</body>

</html>
